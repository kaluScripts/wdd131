<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 – Product Review Form – Darlene Kalu</title>
    <meta name="description" content="A product review submission form built for WDD 131 – Dynamic Web Fundamentals by Darlene Kalu.">
    <meta name="author" content="Darlene Kalu">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <span id="site-title">Product Review</span>
    </header>

    <main>
        <form method="get" action="review.html" id="review-form">

            <div class="field">
                <label for="product">Product Name <span class="required-flag">* Required</span></label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="field">
                <legend>Overall Rating <span class="required-flag">* Required</span></legend>
                <div class="rating-group">
                    <label class="rating-option" for="rating-1">
                        <span class="stars" aria-hidden="true">&starf;</span>
                        <input type="radio" id="rating-1" name="rating" value="1" required>
                        <span class="visually-hidden">1 star</span>
                    </label>
                    <label class="rating-option" for="rating-2">
                        <span class="stars" aria-hidden="true">&starf;&starf;</span>
                        <input type="radio" id="rating-2" name="rating" value="2" required>
                        <span class="visually-hidden">2 stars</span>
                    </label>
                    <label class="rating-option" for="rating-3">
                        <span class="stars" aria-hidden="true">&starf;&starf;&starf;</span>
                        <input type="radio" id="rating-3" name="rating" value="3" required>
                        <span class="visually-hidden">3 stars</span>
                    </label>
                    <label class="rating-option" for="rating-4">
                        <span class="stars" aria-hidden="true">&starf;&starf;&starf;&starf;</span>
                        <input type="radio" id="rating-4" name="rating" value="4" required>
                        <span class="visually-hidden">4 stars</span>
                    </label>
                    <label class="rating-option" for="rating-5">
                        <span class="stars" aria-hidden="true">&starf;&starf;&starf;&starf;&starf;</span>
                        <input type="radio" id="rating-5" name="rating" value="5" required>
                        <span class="visually-hidden">5 stars</span>
                    </label>
                </div>
            </fieldset>

            <div class="field">
                <label for="install-date">Date of Installation <span class="required-flag">* Required</span></label>
                <input type="date" id="install-date" name="installDate" required>
            </div>

            <fieldset class="field">
                <legend>Which features did you find useful in the product? <em>(Check all that apply)</em></legend>
                <div class="checkbox-group">
                    <label class="checkbox-option" for="feature-durability">
                        <input type="checkbox" id="feature-durability" name="features" value="Durability">
                        Durability
                    </label>
                    <label class="checkbox-option" for="feature-ease">
                        <input type="checkbox" id="feature-ease" name="features" value="Ease of Use">
                        Ease of Use
                    </label>
                    <label class="checkbox-option" for="feature-performance">
                        <input type="checkbox" id="feature-performance" name="features" value="Performance">
                        Performance
                    </label>
                    <label class="checkbox-option" for="feature-design">
                        <input type="checkbox" id="feature-design" name="features" value="Design">
                        Design
                    </label>
                </div>
            </fieldset>

            <div class="field">
                <label for="review">Written Review <span class="optional-flag">(Optional)</span></label>
                <textarea id="review" name="review" rows="6"></textarea>
            </div>

            <div class="field">
                <label for="username">Your Name <span class="optional-flag">(Optional)</span></label>
                <input type="text" id="username" name="username">
            </div>

            <div class="field">
                <input type="submit" value="Post Review">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> Darlene Kalu &middot; Abuja, Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
