<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 – Review Submitted – Darlene Kalu</title>
    <meta name="description" content="Confirmation page for a submitted product review, built for WDD 131 – Dynamic Web Fundamentals by Darlene Kalu.">
    <meta name="author" content="Darlene Kalu">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/review.js" defer></script>

<body>
    <header>
        <span id="site-title">Product Review</span>
    </header>

    <main>
        <div class="confirmation-card">
            <h1>Thank You!</h1>
            <p id="confirmation-message">Your review has been submitted.</p>
            <p>Total reviews submitted on this device: <span class="review-count" id="review-count">0</span></p>
            <a href="form.html">&larr; Submit another review</a>
        </div>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> Darlene Kalu &middot; Abuja, Nigeria</p>
        <p id="lastModified"></p>
    </footer>

</html>
