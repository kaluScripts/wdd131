<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="560" fill="#ffffff" stroke="#999999" stroke-width="2"/>

  <!-- Nav bar -->
  <rect x="16" y="16" width="768" height="56" fill="#f2f2f2" stroke="#999999" stroke-width="1.5"/>
  <rect x="32" y="30" width="70" height="28" fill="#d9d9d9" stroke="#999999"/>
  <text x="67" y="48" font-size="10" text-anchor="middle" fill="#555">LOGO</text>
  <line x1="480" y1="44" x2="540" y2="44" stroke="#999999" stroke-width="6"/>
  <line x1="560" y1="44" x2="620" y2="44" stroke="#999999" stroke-width="6"/>
  <line x1="640" y1="44" x2="700" y2="44" stroke="#999999" stroke-width="6"/>
  <line x1="720" y1="44" x2="760" y2="44" stroke="#999999" stroke-width="6"/>
  <text x="480" y="36" font-size="9" fill="#777">Home  Products  About  Contact</text>

  <!-- Hero -->
  <rect x="16" y="88" width="768" height="180" fill="#e6e6e6" stroke="#999999" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="400" y="150" font-size="14" text-anchor="middle" fill="#666">FULL-WIDTH HERO BACKGROUND IMAGE</text>
  <rect x="300" y="170" width="200" height="18" fill="#cccccc"/>
  <text x="400" y="183" font-size="9" text-anchor="middle" fill="#555">Headline</text>
  <rect x="330" y="198" width="140" height="12" fill="#d9d9d9"/>
  <rect x="350" y="220" width="100" height="24" fill="#bfbfbf" stroke="#999"/>
  <text x="400" y="236" font-size="9" text-anchor="middle" fill="#444">CTA Button</text>

  <!-- Section title -->
  <rect x="330" y="290" width="140" height="14" fill="#e0e0e0"/>
  <text x="400" y="301" font-size="9" text-anchor="middle" fill="#666">Featured Products</text>

  <!-- Product grid: 3 columns -->
  <rect x="16" y="318" width="240" height="150" fill="#f4f4f4" stroke="#999999" stroke-dasharray="4"/>
  <rect x="272" y="318" width="240" height="150" fill="#f4f4f4" stroke="#999999" stroke-dasharray="4"/>
  <rect x="528" y="318" width="240" height="150" fill="#f4f4f4" stroke="#999999" stroke-dasharray="4"/>
  <text x="136" y="398" font-size="9" text-anchor="middle" fill="#777">Product Card</text>
  <text x="392" y="398" font-size="9" text-anchor="middle" fill="#777">Product Card</text>
  <text x="648" y="398" font-size="9" text-anchor="middle" fill="#777">Product Card</text>

  <!-- About / value strip -->
  <rect x="16" y="488" width="768" height="40" fill="#ececec" stroke="#999999" stroke-dasharray="4"/>
  <text x="400" y="511" font-size="9" text-anchor="middle" fill="#777">Short blurb: fresh prices, local delivery, in-store pickup</text>

  <!-- Footer -->
  <rect x="16" y="540" width="768" height="0" />
  <text x="400" y="552" font-size="9" text-anchor="middle" fill="#999">Footer: contact / social / copyright</text>
</svg>
