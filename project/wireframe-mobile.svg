<svg viewBox="0 0 300 560" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="300" height="560" fill="#ffffff" stroke="#999999" stroke-width="2"/>

  <!-- Nav bar -->
  <rect x="12" y="12" width="276" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.5"/>
  <rect x="24" y="22" width="50" height="24" fill="#d9d9d9" stroke="#999999"/>
  <text x="49" y="37" font-size="8" text-anchor="middle" fill="#555">LOGO</text>
  <rect x="252" y="24" width="24" height="4" fill="#999"/>
  <rect x="252" y="32" width="24" height="4" fill="#999"/>
  <rect x="252" y="40" width="24" height="4" fill="#999"/>
  <text x="264" y="54" font-size="7" text-anchor="middle" fill="#777">menu</text>

  <!-- Hero -->
  <rect x="12" y="66" width="276" height="150" fill="#e6e6e6" stroke="#999999" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="150" y="120" font-size="10" text-anchor="middle" fill="#666">HERO BACKGROUND IMAGE</text>
  <rect x="60" y="140" width="180" height="14" fill="#cccccc"/>
  <text x="150" y="150" font-size="8" text-anchor="middle" fill="#555">Headline</text>
  <rect x="80" y="160" width="140" height="10" fill="#d9d9d9"/>
  <rect x="95" y="180" width="110" height="20" fill="#bfbfbf" stroke="#999"/>
  <text x="150" y="194" font-size="8" text-anchor="middle" fill="#444">CTA Button</text>

  <!-- Section title -->
  <rect x="90" y="232" width="120" height="12" fill="#e0e0e0"/>
  <text x="150" y="241" font-size="8" text-anchor="middle" fill="#666">Featured Products</text>

  <!-- Product cards stacked (1 col) -->
  <rect x="12" y="254" width="276" height="90" fill="#f4f4f4" stroke="#999999" stroke-dasharray="4"/>
  <text x="150" y="302" font-size="8" text-anchor="middle" fill="#777">Product Card</text>

  <rect x="12" y="352" width="276" height="90" fill="#f4f4f4" stroke="#999999" stroke-dasharray="4"/>
  <text x="150" y="400" font-size="8" text-anchor="middle" fill="#777">Product Card</text>

  <!-- About / value strip -->
  <rect x="12" y="456" width="276" height="50" fill="#ececec" stroke="#999999" stroke-dasharray="4"/>
  <text x="150" y="478" font-size="7" text-anchor="middle" fill="#777">Short blurb: fresh prices,</text>
  <text x="150" y="490" font-size="7" text-anchor="middle" fill="#777">local delivery, in-store pickup</text>

  <!-- Footer -->
  <text x="150" y="536" font-size="7" text-anchor="middle" fill="#999">Footer: contact / social / copyright</text>
</svg>
